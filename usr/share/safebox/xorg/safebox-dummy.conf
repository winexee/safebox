Section "Device"
    Identifier "SafeBoxDummy"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "SafeBoxMonitor"
    HorizSync 30-80
    VertRefresh 50-75
EndSection

Section "Screen"
    Identifier "SafeBoxScreen"
    Device "SafeBoxDummy"
    Monitor "SafeBoxMonitor"

    DefaultDepth 24

    SubSection "Display"
        Depth 24
        Virtual 1366 768
        Modes "1366x768"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "SafeBoxLayout"
    Screen "SafeBoxScreen"
EndSection

    
Section "Extensions"
    Option "MIT-SHM" "Disable"
EndSection
