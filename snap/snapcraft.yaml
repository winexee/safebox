name: safebox
version: '1.7.30'
summary: Namespace-based, RAM-backed lightweight sandbox environment
description: |
  SafeBox creates a volatile, namespace-based desktop sandbox environment with Bubblewrap.
  All filesystem modifications in the guest environment are held in RAM
  and wiped completely upon session exit.

grade: stable
confinement: classic
base: core24

apps:
  safebox:
    command: usr/bin/safebox

parts:
  safebox-app:
    plugin: dump
    source: .
    stage-packages:
      - python3-gi
      - gir1.2-gtk-3.0
      - bubblewrap
      - libseccomp2
      - librsvg2-common
      - xserver-xephyr
      - x11-utils
      - dbus-x11
      - debootstrap
      - pulseaudio-utils
    prime:
      - -debian
      - -docs
      - -tests
      - -.github
      - -scratch
      - -snap
      - -BUGFIX_ANALYSIS.md
      - -README.md
      - -README.en.md
      - -LICENSE
